<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Quiz Me?</h1>
    <hr />
    <!-- Movie Question -->
    <form id="movie-form">
      <label>
        🎥 What is my favorite movie?
        <select id="movie-answer">
          <option value="movie1">How to Train Your Dragon</option>
          <option value="movie2">Pacific Rim</option>
          <option value="movie3">The Grand Budapest Hotel</option>
          <option value="movie4">Avengers Age Of Ultron</option>
        </select>
      </label>
      <button type="submit" id="button1">Check Movie Answer</button>
    </form>
    <div id="movie-result">
      <p id="movie-text"></p>
      <img id="cloudBoy" src="Cloudjumper THE BOYYY.jpg">
    </div>
    <hr />
    <!-- Book Question -->
    <form id="book-form">
      <label>
        What is my blanket (Theres a super duper subtle hint hidden in the website)
        <select id="book-answer">
          <option value="book1">green</option>
          <option value="book2">sunflower</option>
        </select>
      </label>
      <button type="submit">Check Book Answer</button>
    </form>
    <div id="book-result">
      <p id="book-text"></p>
      <img id="imgCorrect" src="happy-memes-make-you-smile-more-07-4109484571.jpg">
      <img id="imgWrong" src="spongebob-crying-meme.jpg.png">
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      
      
      $("#cloudBoy").hide();
      $("#imgCorrect").hide();
      $("#imgWrong").hide();
      
      //========================Movie Question jQuery Code
      $("#movie-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#movie-answer");
        var answer = $answer.val();

        if (answer === "movie1") {
          $("#movie-text").text("YESSSS!");
          $("#cloudBoy").fadeIn(500);
        } 
        else {
          $("#movie-text").text("Try Again!");
          $("#cloudBoy").hide(500);
        }
      });

      $("#button1").mouseover(function () {
        $("#button1").animate({
        marginLeft: "330px",
        rotate: "75deg",
       },300)
      });

      $("#movie-form select").mouseover(function () {
        $("#movie-form select").animate({
        marginLeft: "330px",
       },300)
      });

      //=======================Book Question jQuery Code
      $("#book-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#book-answer");
        var answer = $answer.val();

        if (answer === "book2") {
          $("#book-text").text("Wow, greeeaaaaat joooooob");
          $("#imgCorrect").fadeIn(500).animate({
        rotate: "360000deg",
        },30000);
          $("#imgWrong").fadeOut(500);
        } 
        else {
          $("#book-text").text("I know things can be hard but you got this!");
          $("#imgCorrect").fadeOut(500);
          $("#imgWrong").fadeIn(500);
        }
      });
      
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
